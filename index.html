<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, World!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #ff6ec4; --c2: #7873f5; --c3: #4ade80; --c4: #38bdf8; --c5: #facc15;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0b0b1a;
    color: #fff;
    overflow: hidden;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  /* Animated aurora blobs */
  .aurora { position: fixed; inset: 0; z-index: 0; filter: blur(80px) saturate(140%); opacity: .85; }
  .blob { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; mix-blend-mode: screen; }
  .b1 { background: radial-gradient(circle, var(--c1), transparent 60%); top: -20%; left: -15%; animation: drift1 18s ease-in-out infinite alternate; }
  .b2 { background: radial-gradient(circle, var(--c2), transparent 60%); bottom: -25%; right: -15%; animation: drift2 22s ease-in-out infinite alternate; }
  .b3 { background: radial-gradient(circle, var(--c4), transparent 60%); top: 30%; left: 35%; animation: drift3 26s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(25vw, 20vh) scale(1.2); } }
  @keyframes drift2 { to { transform: translate(-30vw, -15vh) scale(.9); } }
  @keyframes drift3 { to { transform: translate(-20vw, 15vh) scale(1.3); } }

  /* Subtle grain */
  .grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  .card {
    position: relative; z-index: 2;
    width: min(760px, 100%);
    padding: clamp(36px, 7vw, 72px) clamp(24px, 6vw, 64px);
    text-align: center;
    border-radius: 28px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    transform-style: preserve-3d;
    transition: transform .2s ease-out;
    animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.96); } }

  .eyebrow {
    font-weight: 500; letter-spacing: .35em; text-transform: uppercase;
    font-size: clamp(11px, 1.6vw, 13px); color: rgba(255,255,255,.7);
    margin-bottom: 18px;
    animation: rise 1.2s .2s cubic-bezier(.2,.8,.2,1) both;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(48px, 11vw, 112px);
    line-height: 1.02;
    letter-spacing: -.02em;
    background: linear-gradient(100deg, var(--c5), var(--c1) 30%, var(--c2) 55%, var(--c4) 80%, var(--c5));
    background-size: 250% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shimmer 8s linear infinite, rise 1.2s .35s cubic-bezier(.2,.8,.2,1) both;
    filter: drop-shadow(0 6px 30px rgba(120,115,245,.35));
  }
  h1 em { font-style: italic; }
  @keyframes shimmer { to { background-position: 250% center; } }

  .divider {
    width: 80px; height: 3px; margin: 28px auto; border-radius: 3px;
    background: linear-gradient(90deg, var(--c1), var(--c4));
    animation: grow 1.4s .8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes grow { from { width: 0; opacity: 0; } }

  p.sub {
    font-weight: 300; font-size: clamp(15px, 2.2vw, 19px);
    color: rgba(255,255,255,.82); max-width: 32ch; margin: 0 auto;
    animation: rise 1.2s 1s cubic-bezier(.2,.8,.2,1) both;
  }
  .clock {
    margin-top: 30px; font-weight: 500; font-size: 13px; letter-spacing: .12em;
    color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums;
    animation: rise 1.2s 1.2s cubic-bezier(.2,.8,.2,1) both;
  }

  /* Site navigation */
  .nav {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3;
    display: flex; gap: 4px; padding: 6px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .nav a {
    color: rgba(255,255,255,.75); text-decoration: none; font-size: 14px; font-weight: 500;
    padding: 8px 16px; border-radius: 999px; transition: background .2s, color .2s;
  }
  .nav a:hover { color: #fff; background: rgba(255,255,255,.1); }
  .nav a[aria-current="page"] { color: #0b0b1a; background: #fff; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="aurora">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <canvas id="stars"></canvas>
  <div class="grain"></div>

  <nav class="nav">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="card" id="card">
    <div class="eyebrow">Welcome to Project X</div>
    <h1 id="title">Hello, <em>World!</em></h1>
    <div class="divider"></div>
    <p class="sub">Every great project starts with a simple greeting. This one starts with style.</p>
    <div class="clock" id="clock"></div>
  </main>

<script>
  // Floating sparkle particles
  (function () {
    const c = document.getElementById('stars'), ctx = c.getContext('2d');
    let w, h, dots;
    const resize = () => {
      w = c.width = innerWidth * devicePixelRatio;
      h = c.height = innerHeight * devicePixelRatio;
      c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
      dots = Array.from({ length: Math.round(innerWidth / 12) }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: (Math.random() * 1.6 + .4) * devicePixelRatio,
        v: (Math.random() * .3 + .1) * devicePixelRatio,
        p: Math.random() * Math.PI * 2
      }));
    };
    const tick = t => {
      ctx.clearRect(0, 0, w, h);
      for (const d of dots) {
        d.y -= d.v; if (d.y < -5) { d.y = h + 5; d.x = Math.random() * w; }
        const a = .35 + .35 * Math.sin(t / 700 + d.p);
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
      }
      requestAnimationFrame(tick);
    };
    addEventListener('resize', resize); resize();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(tick);
  })();

  // Gentle 3D tilt following the mouse
  (function () {
    const card = document.getElementById('card');
    if (matchMedia('(pointer: fine)').matches) {
      addEventListener('mousemove', e => {
        const x = (e.clientX / innerWidth - .5) * 10;
        const y = (e.clientY / innerHeight - .5) * -10;
        card.style.transform = `perspective(900px) rotateX(${y}deg) rotateY(${x}deg)`;
      });
      addEventListener('mouseleave', () => card.style.transform = '');
    }
  })();

  // Live clock
  (function () {
    const el = document.getElementById('clock');
    const upd = () => el.textContent = new Date().toLocaleString(undefined,
      { weekday: 'long', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    upd(); setInterval(upd, 1000);
  })();
</script>
</body>
</html>
