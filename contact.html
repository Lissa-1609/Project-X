<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Project X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #ff6ec4; --c2: #7873f5; --c3: #4ade80; --c4: #38bdf8; --c5: #facc15;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0b0b1a; color: #fff;
    min-height: 100vh; overflow-x: hidden;
    display: grid; place-items: center;
    padding: 96px 16px 48px;
  }
  .aurora { position: fixed; inset: 0; z-index: 0; filter: blur(80px) saturate(140%); opacity: .85; }
  .blob { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; mix-blend-mode: screen; }
  .b1 { background: radial-gradient(circle, var(--c5), transparent 60%); top: -20%; left: -15%; animation: drift1 20s ease-in-out infinite alternate; }
  .b2 { background: radial-gradient(circle, var(--c1), transparent 60%); bottom: -25%; right: -15%; animation: drift2 24s ease-in-out infinite alternate; }
  .b3 { background: radial-gradient(circle, var(--c2), transparent 60%); top: 30%; left: 35%; animation: drift3 28s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(25vw, 20vh) scale(1.2); } }
  @keyframes drift2 { to { transform: translate(-30vw, -15vh) scale(.9); } }
  @keyframes drift3 { to { transform: translate(-20vw, 15vh) scale(1.3); } }

  .nav {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3;
    display: flex; gap: 4px; padding: 6px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .nav a {
    color: rgba(255,255,255,.75); text-decoration: none; font-size: 14px; font-weight: 500;
    padding: 8px 16px; border-radius: 999px; transition: background .2s, color .2s;
  }
  .nav a:hover { color: #fff; background: rgba(255,255,255,.1); }
  .nav a[aria-current="page"] { color: #0b0b1a; background: #fff; }

  .card {
    position: relative; z-index: 2;
    width: min(620px, 100%);
    padding: clamp(32px, 6vw, 56px) clamp(22px, 6vw, 52px);
    border-radius: 28px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.96); } }

  .eyebrow {
    font-weight: 500; letter-spacing: .35em; text-transform: uppercase;
    font-size: clamp(11px, 1.6vw, 13px); color: rgba(255,255,255,.7); margin-bottom: 14px;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(40px, 8vw, 72px); line-height: 1.05; letter-spacing: -.02em;
    background: linear-gradient(100deg, var(--c5), var(--c1) 40%, var(--c2) 70%, var(--c5));
    background-size: 250% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 8s linear infinite;
  }
  h1 em { font-style: italic; }
  @keyframes shimmer { to { background-position: 250% center; } }
  .lead { margin-top: 16px; font-weight: 300; font-size: clamp(15px, 2.1vw, 18px); line-height: 1.6; color: rgba(255,255,255,.82); }

  form { margin-top: 28px; display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; letter-spacing: .04em; color: rgba(255,255,255,.75); }
  input, textarea {
    font: inherit; font-size: 15px; font-weight: 300; color: #fff;
    padding: 12px 14px; border-radius: 14px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18);
    outline: none; transition: border-color .2s, background .2s, box-shadow .2s;
  }
  textarea { min-height: 130px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,.4); }
  input:focus, textarea:focus { border-color: var(--c4); background: rgba(255,255,255,.1); box-shadow: 0 0 0 3px rgba(56,189,248,.25); }
  button {
    justify-self: start; font: inherit; font-weight: 500; font-size: 15px; cursor: pointer;
    padding: 12px 24px; border: 0; border-radius: 999px; color: #0b0b1a; background: #fff;
    transition: transform .2s, box-shadow .2s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,110,196,.45); }

  .thanks { display: none; margin-top: 28px; padding: 20px; border-radius: 16px; background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.4); line-height: 1.5; }
  .sent form { display: none; }
  .sent .thanks { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="aurora">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <nav class="nav">
    <a href="hello.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>

  <main class="card" id="card">
    <div class="eyebrow">Contact</div>
    <h1>Say <em>hello.</em></h1>
    <p class="lead">Questions, ideas, or just want to chat? Drop a message below. Want to learn more first? Read the <a href="about.html" style="color: var(--c4)">About page</a>.</p>

    <form id="form">
      <label>Name
        <input name="name" required placeholder="Your name" autocomplete="name">
      </label>
      <label>Email
        <input name="email" type="email" required placeholder="you@example.com" autocomplete="email">
      </label>
      <label>Message
        <textarea name="message" required placeholder="What's on your mind?"></textarea>
      </label>
      <button type="submit">Send message</button>
    </form>

    <div class="thanks" role="status">
      <strong>Thanks, <span id="who">friend</span>!</strong><br>
      Your message is noted. (This form isn't connected to an inbox yet, so nothing was actually sent.)
    </div>
  </main>

<script>
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const name = new FormData(e.target).get('name').trim();
    if (name) document.getElementById('who').textContent = name;
    document.getElementById('card').classList.add('sent');
  });
</script>
</body>
</html>
